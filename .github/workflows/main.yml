name: Sample Workflow

on: [ workflow_dispatch, push ]


jobs:
  amd_job:
    name: Amd Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v2
        
      - name: Build Image
        run: docker build -t test:latest .
        
      - name: Inspect Image Arch
        run: docker inspect test:latest |grep Arch
        
      - name: Run Container
        run: docker run -t test:latest       
        
  power_job:
    name: Power Image Build
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Code Checkout
        uses: actions/checkout@v2
        
      - name: Build Image
        run: sudo docker build -t test:latest .
        
      - name: Inspect Image Arch
        run: sudo docker inspect test:latest |grep Arch
        
      - name: Run Container
        run: sudo docker run -t test:latest           
 
